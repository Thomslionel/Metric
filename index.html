<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric</title>
</head>

<body>


    <div class="container">

        <h2 class="title">Metric/Imperial Unit Conversion</h2>

        <input type="number" id="value" min="0">

        <button id="convert-btn">Convert</button>
    </div>




    <div class="divide">
        <h3 class="small-title">Length (Meter/Feet)</h3>
        <p id="length-result" class="resultat"></p>

    </div>

    <div class="divide">
        <h3 class="small-title">Volume (Liters/Gallons)</h3>
        <p id="volume-result" class="resultat"></p>

    </div>

    <div class="divide">
        <h3 class="small-title">Mass (Kilograms/Pounds)</h3>
        <p id="mass-result" class="resultat"></p>

    </div>


    <footer class="footer-container">
    <p class="footer">
        Copyright © 2026 Metric/Imperial Unit Conversion
    </p>

    <p class="name">
        Designed by 
        <span>Thomas MANLY</span><br>
        thomsmanly@gmail.com
    </p>
</footer>



    <script src="index.js"></script>

</body>

</html>
